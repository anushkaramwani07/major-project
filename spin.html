<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Movie Picker</title>
</head>

<body class="spin-page">
    <header class="site-header">
        <a href="index.html" class="logo">Movie Picker</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="spin.html">Spin the wheel</a>
            <a href="manual.html">Pick Manually</a>
        </nav>
    </header>
 
<fieldset class="ui-wheel-of-fortune">
        <ul>
            <li>ACTION</li>
            <li>COMEDY</li>
            <li>HORROR</li>
            <li>CRIME</li>
            <li>DRAMA</li>
            <li>ROMANCE</li>
            <li>SCIENCE FICTION</li>
            <li>MYSTERY</li>
            <li>CRIME</li>
            <li>ADVENTURE</li>
            <li>ANIMATION</li>
            <li>FANTASY</li>
        </ul>
        <button type="button">SPIN</button>
    </fieldset>

    <div class="movie-filter">
        <select id = "movie-filter">
            <option value="">Filter movies</option>
            <option value="az">A-Z</option>
            <option value="rating-asc">Rating: Low to High</option>
            <option value="rating-desc">Rating: High to Low</option>
            <option value="hollywood">Hollywood</option>
        </select>
    </div>
<!-- to print everything like title, release date, ratings and all. -->
<h2 id = "selected-genre-title"></h2>
<div id="results"></div>

<!-- keep this in here cause all the HTML elements would be loaded by this time! -->
    <script src="scripts.js"></script>
</body>

</html>
